# SPDX-License-Identifier: GPL-3.0-or-later
# Maintainer tool: show how Debian stable and testing resolve the init-system and
# boot-loader choices Corry offers, on a live-like system. Nothing here fails the
# run; read the log.
name: Debian package probe
on:
  workflow_dispatch:
  # Also runs when this file itself changes on a development branch.
  push:
    branches: ['claude/**', 'codex/**']
    paths: ['.github/workflows/debian-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        debian: [stable, testing]
    container: debian:${{ matrix.debian }}
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Package metadata
        shell: bash {0}
        run: |
          apt-get update >/dev/null
          apt-get install -y --no-install-recommends apt-utils ca-certificates debconf-utils >/dev/null
          for p in sysvinit-core openrc runit-init runit-services elogind libelogind0 libpam-elogind systemd-boot \
                   systemd-boot-tools systemd-boot-efi systemd-boot-efi-amd64-signed refind extlinux syslinux-common \
                   u-boot-menu gdm3 gnome-shell network-manager polkitd lightdm sddm xfce4-session; do
            echo "=== $p"
            apt-cache show "$p" 2>&1 | grep -E '^(Package|Version|Depends|Pre-Depends|Recommends|Conflicts|Breaks|Provides|Replaces):' | head -12
          done
      - name: Qt 6 SVG packages (the image plugin draws Corry's SVG logo, slides and icons)
        shell: bash {0}
        run: |
          apt-cache search --names-only 'qt6.*svg|svg.*qt6'
          for p in qt6-svg-plugins libqt6svg6 qt6-svg-dev; do echo "=== $p"; apt-cache show "$p" 2>&1 | grep -E '^(Package|Version|Depends):' | head -4; done
          apt-get install -y --no-install-recommends qt6-svg-dev >/dev/null 2>&1
          dpkg -S '*/qt6/plugins/imageformats/libqsvg.so' || echo 'libqsvg.so: not installed by qt6-svg-dev'
      - name: Live-like system with systemd, logind, NetworkManager, LightDM, Xfce session and GDM
        shell: bash {0}
        run: |
          apt-get install -y --no-install-recommends systemd-sysv libpam-systemd dbus-user-session polkitd \
            network-manager lightdm xfce4-session gdm3 >/dev/null 2>&1 || echo "install failed"
          ls -l /sbin/init
          apt-mark showmanual | tr '\n' ' '; echo
      - name: Simulate the init switches with GDM installed (expected to drag GNOME pieces)
        shell: bash {0}
        run: |
          M="systemd-sysv- libpam-systemd- systemd- libnss-systemd-"
          for set in "sysvinit-core elogind libpam-elogind orphan-sysvinit-scripts" \
                     "openrc sysvinit-core elogind libpam-elogind orphan-sysvinit-scripts sysv-rc-" \
                     "runit-init elogind libpam-elogind orphan-sysvinit-scripts"; do
            echo "=== apt-get -s install $set $M"
            apt-get -s install -y $set $M 2>&1 | grep -E '^(Remv|E:|   )' | head -60
          done
      - name: Without GDM, simulate, then really switch to sysvinit and look at what is left of systemd
        shell: bash {0}
        run: |
          apt-get purge -y gdm3 >/dev/null 2>&1
          M="systemd-sysv- libpam-systemd- systemd- libnss-systemd-"
          echo "=== simulate sysvinit"; apt-get -s install -y sysvinit-core elogind libpam-elogind orphan-sysvinit-scripts $M 2>&1 | grep -E '^(Remv|Inst|E:|   )' | grep -v '^Inst lib' | head -60
          echo "=== simulate openrc";   apt-get -s install -y openrc sysvinit-core elogind libpam-elogind orphan-sysvinit-scripts sysv-rc- $M 2>&1 | grep -E '^(Remv|E:|   )' | head -40
          echo "=== simulate runit";    apt-get -s install -y runit-init elogind libpam-elogind orphan-sysvinit-scripts $M 2>&1 | grep -E '^(Remv|E:|   )' | head -40
          echo "=== real switch to sysvinit"
          apt-get install -y sysvinit-core elogind libpam-elogind orphan-sysvinit-scripts $M 2>&1 | tail -12
          ls -l /sbin/init; readlink -f /sbin/init; dpkg-query -S "$(readlink -f /sbin/init)"
          dpkg-query -W -f='${Package} ${db:Status-Abbrev}\n' systemd systemd-sysv libpam-systemd libpam-elogind elogind libelogind0 libsystemd0 systemd-timesyncd libnss-systemd sysv-rc initscripts 2>&1
          echo "=== leftovers matching systemd"; dpkg-query -W -f='${Package} ${db:Status-Abbrev}\n' | grep -i systemd
          echo "=== simulate purge of what is left"; apt-get -s purge -y $(dpkg-query -W -f='${Package} ${db:Status-Abbrev}\n' | awk '$2 ~ /^ii/ && $1 ~ /^(systemd|libnss-systemd|libpam-systemd|systemd-)/ {print $1}') 2>&1 | grep -E '^(Remv|E:|   )' | head -30
          echo "=== then openrc on top"; apt-get -s install -y openrc sysv-rc- 2>&1 | grep -E '^(Remv|Inst|E:|   )' | head -20
          echo "=== then runit-init instead"; apt-get -s install -y runit-init 2>&1 | grep -E '^(Remv|Inst|E:|   )' | head -20
          echo "=== openrc files"; apt-get download openrc >/dev/null 2>&1 && dpkg -c openrc_*.deb | grep -E 'README|inittab|postinst|/sbin/|rc-update' | head -20
          echo "=== openrc README.Debian"; apt-get install -y --no-install-recommends openrc sysv-rc- >/dev/null 2>&1; sed -n 1,80p /usr/share/doc/openrc/README.Debian 2>/dev/null || echo missing
      - name: Why the switch removes desktop packages (full simulation, no GNOME leftovers)
        shell: bash {0}
        run: |
          apt-get autoremove --purge -y >/dev/null 2>&1
          apt-get install -y --no-install-recommends lightdm-gtk-greeter xfce4-panel xfdesktop4 thunar pipewire-pulse wireplumber >/dev/null 2>&1
          M="systemd-sysv- libpam-systemd- systemd- libnss-systemd-"
          echo "=== full simulation"; apt-get -s install -y --allow-remove-essential --no-install-recommends sysvinit-core elogind libpam-elogind orphan-sysvinit-scripts $M 2>&1 | grep -vE '^(Inst|Conf) ' | head -80
          echo "=== hard dependencies of the desktop pieces"
          for p in dbus-user-session xfce4-session xfconf xfce4-settings lightdm-gtk-greeter wireplumber pipewire-pulse pipewire-bin network-manager polkitd udev; do
            echo "--- $p"; apt-cache show $p 2>/dev/null | grep -E '^(Depends|Pre-Depends):' | head -2 | grep -oE '(systemd[a-z0-9-]*|libpam-systemd|dbus-user-session|default-logind|logind)[^,]*' | sort -u | tr '\n' ' '; echo
          done
          echo "=== installed packages depending on systemd itself"; apt-cache rdepends --installed --important systemd 2>/dev/null | head -40
          echo "=== installed packages depending on libpam-systemd"; apt-cache rdepends --installed --important libpam-systemd 2>/dev/null | head -20
          echo "=== installed packages depending on dbus-user-session"; apt-cache rdepends --installed --important dbus-user-session 2>/dev/null | head -20
      - name: Boot loader packages and their hooks
        shell: bash {0}
        run: |
          echo 'refind refind/install_to_esp boolean false' | debconf-set-selections
          # One at a time: a package missing on this base (rEFInd on testing) must not stop the others.
          for p in systemd-boot refind extlinux syslinux-common; do
            echo "=== install $p"; apt-get install -y --no-install-recommends "$p" 2>&1 | tail -3
          done
          echo "=== systemd-boot without systemd?"; apt-get -s install -y systemd-boot 2>&1 | grep -E '^(Remv|Inst|E:|   )' | head -20
          for p in systemd-boot systemd-boot-tools systemd-boot-efi refind extlinux syslinux-common; do echo "=== files of $p"; dpkg -L $p 2>/dev/null | grep -E 'bin/|kernel|initramfs|default|README|\.efi|mbr|drivers' | head -24; done
          for f in /var/lib/dpkg/info/systemd-boot.postinst /var/lib/dpkg/info/refind.postinst /var/lib/dpkg/info/extlinux.postinst /var/lib/dpkg/info/u-boot-menu.postinst /etc/kernel/postinst.d/zz-systemd-boot /etc/initramfs/post-update.d/zz-systemd-boot /etc/default/extlinux /etc/default/u-boot /usr/share/doc/systemd-boot/README.Debian /usr/share/doc/extlinux/README.Debian /usr/share/doc/refind/README.Debian; do
            echo "=== $f"; test -e "$f" && sed -n 1,60p "$f" || echo missing; done
          echo "=== extlinux tools"; ls -l /usr/sbin/extlinux* /usr/bin/extlinux* /usr/lib/EXTLINUX /usr/lib/syslinux/mbr 2>&1 | head -20; sed -n 1,80p /usr/sbin/extlinux-update 2>/dev/null
          echo "=== kernel-install"; ls -l /usr/bin/kernel-install /usr/lib/kernel/install.d/ 2>&1
          echo "=== bootctl"; which bootctl; dpkg -S "$(which bootctl)" 2>&1
          echo "=== refind-install"; grep -n "refind_linux.conf\|/proc/cmdline\|usedefault" /usr/sbin/refind-install | head -12
          echo "=== u-boot-update"; sed -n 1,60p /usr/sbin/u-boot-update 2>/dev/null
          echo "=== shim"; ls -l /usr/lib/shim 2>&1 | head
