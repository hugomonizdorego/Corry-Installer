# SPDX-License-Identifier: GPL-3.0-or-later
name: Corry Debian build
on:
  workflow_dispatch:
  push:
    branches: ['claude/**', 'codex/**']
    paths: ['src/**', 'config/**', 'tools/**', 'settings.conf', '.github/workflows/corry.yml']
  pull_request:
    paths: ['src/**', 'config/**', 'tools/**', 'settings.conf', '.github/workflows/corry.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Edukasaun OS and DebION are based on Debian stable and Debian testing.
        debian: ['stable', 'testing']
    container: debian:${{ matrix.debian }}
    env:
      CORRY_BUILD_TYPE: Debug
      CORRY_DEBIAN_BASE: ${{ matrix.debian }}
    steps:
      - run: apt-get update && apt-get install -y git ca-certificates
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: bash tools/install-dependencies.sh build
      - run: python3 tools/test-profile.py -v
      - run: bash tools/build-corry.sh
      - run: QT_QPA_PLATFORM=offscreen ctest --test-dir build-corry -R '^(userstest|partitionconfigtest|corrypartitiontest|welcometest)$' --output-on-failure
      - run: DESTDIR=/tmp/corry-stage bash tools/install-corry.sh build-corry
      - run: for distro in edukasaun debion; do python3 tools/corry-branding.py --check config/distros/$distro; done
      - run: DESTDIR=/tmp/corry-stage-edukasaun bash tools/install-profile.sh --distro edukasaun
      - run: DESTDIR=/tmp/corry-stage-debion bash tools/install-profile.sh --distro debion
      - name: Package development builds
        run: |
          mkdir -p dist
          for distro in edukasaun debion; do
            release="/tmp/corry-release-$distro"
            mkdir -p "$release"
            cp -a /tmp/corry-stage/. "$release/"
            cp -a "/tmp/corry-stage-$distro/." "$release/"
            # One manifest covering the engine and the profile.
            sort -u /tmp/corry-stage/usr/lib/corry/manifest "/tmp/corry-stage-$distro/usr/lib/corry/manifest" > "$release/usr/lib/corry/manifest"
            tar -I 'xz -T2 -3' -C "$release" -cf "dist/corry-$(cat VERSION)-$distro-debian-${{ matrix.debian }}-amd64.tar.xz" .
          done
          cd dist
          sha256sum *.tar.xz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: corry-debian-${{ matrix.debian }}-amd64
          path: dist/*
          retention-days: 14
