# SPDX-License-Identifier: GPL-3.0-or-later
name: Corry Debian build
on:
  workflow_dispatch:
  push:
    branches: ['claude/**', 'codex/**']
    paths: ['src/**', 'config/**', 'tools/**', 'debian/**', 'settings.conf', 'VERSION', 'CMakeLists.txt', '.github/workflows/corry.yml']
  pull_request:
    paths: ['src/**', 'config/**', 'tools/**', 'debian/**', 'settings.conf', 'VERSION', 'CMakeLists.txt', '.github/workflows/corry.yml']
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Edukasaun OS and DebION are based on Debian stable and Debian testing.
        debian: ['stable', 'testing']
    container: debian:${{ matrix.debian }}
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - run: apt-get update && apt-get install -y git ca-certificates
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install build dependencies from debian/control
        run: apt-get install -y dpkg-dev debhelper && apt-get build-dep -y ./
      - name: Build the Debian packages (runs the native and profile tests)
        run: dpkg-buildpackage -us -uc -b
      - name: Install Debian's Calamares first, as a live image would have it
        run: |
          apt-get install -y calamares calamares-settings-debian
          test -f /etc/xdg/autostart/calamares-desktop-icon.desktop || ls /etc/xdg/autostart
      - name: Install Corry over it; Calamares must be removed
        run: |
          cd ..
          apt-get install -y ./corry_*.deb ./corry-edukasaun_*_all.deb
          # The APT hook purges leftovers on the next dpkg run.
          apt-get install -y --reinstall ./corry-edukasaun_*_all.deb
      - name: Verify nothing of Debian's Calamares is left
        run: |
          set -x
          for package in calamares calamares-settings-debian; do
            status=$(dpkg-query -W -f='${db:Status-Abbrev}' "$package" 2>/dev/null || true)
            test -z "$status" || test "$status" = "un " || { echo "$package is still $status"; exit 1; }
          done
          ! ls /etc/xdg/autostart/calamares-desktop-icon.desktop /usr/share/applications/install-debian.desktop 2>/dev/null
          test "$(readlink -f /usr/bin/install-debian)" = /usr/bin/corry-installer
          dpkg-query -S /etc/calamares/settings.conf | grep -q '^corry-edukasaun:'
          grep -q 'corryPage: greeting' /etc/calamares/modules/welcome.conf
          dpkg --verify corry corry-edukasaun
          # The preflight check runs and reports the missing live image (no ISO here).
          ! /usr/lib/corry/preflight.py --config /etc/calamares 2> preflight.txt
          grep -q 'Live system image not found' preflight.txt
      - name: Start the installed Corry on a virtual display
        run: |
          apt-get install -y xvfb xauth
          # From an empty directory, so nothing from the source tree is used.
          mkdir -p /tmp/smoke && cd /tmp/smoke
          LANG=en_US.UTF-8 timeout 40 xvfb-run -a -s '-screen 0 1280x860x24' calamares -d > calamares.log 2>&1 || true
          grep -E 'Using Calamares|Loaded branding' calamares.log
          ! grep -E 'FATAL|Cowardly refusing|QML component not ready' calamares.log
          grep -q 'Using Calamares settings file at "/etc/calamares/settings.conf"' calamares.log
          grep -q 'Using Calamares QML directory "/usr/share/calamares/qml"' calamares.log
          grep -q 'Using Calamares branding file at "/etc/calamares/branding/corry/branding.desc"' calamares.log
          grep -q 'Loaded branding component "corry"' calamares.log
      - name: Switch profile, then remove Corry completely
        run: |
          cd ..
          apt-get install -y ./corry-debion_*_all.deb
          ! dpkg-query -W -f='${db:Status-Abbrev}' corry-edukasaun 2>/dev/null | grep -q '^ii'
          grep -q 'DebION' /etc/calamares/branding/corry/branding.desc
          apt-get purge -y corry corry-debion
          ! ls -d /etc/calamares /usr/lib/corry /usr/share/calamares /etc/apt/apt.conf.d/80corry-remove-calamares 2>/dev/null
      - name: Collect packages (no debug symbols) with the install script
        run: |
          mkdir -p dist
          cp ../corry_*.deb ../corry-edukasaun_*.deb ../corry-debion_*.deb dist/
          cp tools/install-corry-debs.sh dist/
          printf '%s\n' 'Install Corry (needs internet for the dependencies):' \
            '  sudo sh install-corry-debs.sh edukasaun    (or: debion)' \
            'Do not use "dpkg -i": it does not install the dependencies.' > dist/INSTALL.txt
          cd dist && sha256sum *.deb > SHA256SUMS
      - name: Repair a failed "dpkg -i" with the install script
        run: |
          # Remove one of Corry's dependencies (autoremove would try to remove
          # sudo, which refuses in a container), then do what users did:
          # dpkg -i without the dependencies fails half-way.
          apt-get remove -y zenity
          dpkg -i dist/corry_*.deb dist/corry-edukasaun_*.deb || true
          sh dist/install-corry-debs.sh edukasaun
          dpkg-query -W -f='${db:Status-Abbrev}' corry corry-edukasaun | grep -qx 'ii ii '
          /usr/lib/corry/preflight.py --config /etc/calamares 2>&1 | grep -q 'Live system image not found'
          apt-get purge -y corry corry-edukasaun
      - uses: actions/upload-artifact@v4
        with:
          name: corry-0.1-debian-${{ matrix.debian }}-amd64-debs
          path: dist/*
          retention-days: 14
