modules-search:
- local
# The welcome module runs twice: a greeting page, then the system check.
instances:
- id: check
  module: welcome
  config: welcomecheck.conf
sequence:
- show:
  - welcome
  - welcome@check
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - corrycleanup
  - corryupdate
  - corrygrub
  - initramfs
  - grubcfg
  - bootloader
  - umount
- show:
  - finished
branding: corry
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
