# Corry Installer 0.1 development profile for Debian live images.
---
modules-search: [ local ]
sequence:
- show: [ welcome, locale, keyboard, partition, users, summary ]
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - corrycleanup
  - initramfs
  - grubcfg
  - bootloader
  - umount
- show: [ finished ]
branding: corry
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
