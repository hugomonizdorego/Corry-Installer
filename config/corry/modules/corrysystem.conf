# SPDX-License-Identifier: GPL-3.0-or-later
#
# Corry "System components" page: the init system and the boot loader of the
# new system. The option marked default is what the live image already has; it
# works offline and is removed cleanly when an alternative is installed. Every
# alternative needs internet, because its packages are downloaded from the
# distribution's repositories during installation.
#
# Keys per option:
#   id            short name used in global storage ("corrySystem")
#   name          shown on the page
#   description   one or two sentences, shown on the page
#   packages      Debian packages installed into the target (empty for the default)
#   default       true for the one option that is already installed
#   firmware      [bios], [efi] or both; a boot loader is hidden-with-reason elsewhere
#   architectures Debian architecture names the option is limited to (empty: all)
#   filesystems   filesystems the loader can read /boot from (empty: all)
#   secureBoot    true if the loader is signed for UEFI Secure Boot (only GRUB is)
#   needsSystemd  loader that relies on systemd's kernel-install (informational)
---
init:
  - id: systemd
    name: systemd
    description: "Debian's default since Debian 8. Starts services in parallel and manages the whole system."
    default: true
  - id: sysvinit
    name: SysVinit
    description: "The classic sequential init of Linux, with runlevels and /etc/init.d scripts. Session management comes from elogind; systemd is removed."
    packages: [ sysvinit-core, elogind, libpam-elogind, orphan-sysvinit-scripts ]
  - id: openrc
    name: OpenRC
    description: "Dependency-based service manager: more modern than SysVinit, lighter than systemd. Debian runs it on the SysVinit init; systemd is removed."
    packages: [ openrc, sysvinit-core, elogind, libpam-elogind, orphan-sysvinit-scripts ]
  - id: runit
    name: runit
    description: "Very small and fast service supervision; a good fit for old hardware and containers. systemd is removed."
    packages: [ runit-init, runit-services, elogind, libpam-elogind, orphan-sysvinit-scripts ]

bootloader:
  - id: grub
    name: GRUB 2
    description: "Debian's standard for BIOS and UEFI (grub-pc / grub-efi). Finds other operating systems for dual boot."
    default: true
    firmware: [ bios, efi ]
    secureBoot: true
  - id: systemd-boot
    name: systemd-boot
    description: "Fast, minimal text menu made for UEFI only. Kernels are copied to the EFI partition and kept up to date by kernel-install. Needs the systemd init."
    packages: [ systemd-boot ]
    firmware: [ efi ]
    needsSystemd: true
  - id: refind
    name: rEFInd
    description: "Graphical boot menu with themes and icons; reliable for computers with several operating systems. UEFI only. If the base has no refind package, GRUB is installed instead."
    packages: [ refind ]
    firmware: [ efi ]
    filesystems: [ ext2, ext3, ext4, btrfs ]
  - id: extlinux
    name: Syslinux / EXTLINUX
    description: "Very small loader, the standard of live USB media and older BIOS computers. Needs an ext4 or XFS /boot (it cannot read compressed Btrfs)."
    packages: [ extlinux, syslinux-common ]
    firmware: [ bios ]
    filesystems: [ ext2, ext3, ext4, xfs ]
  - id: uboot
    name: U-Boot
    description: "Industry standard of ARM and embedded computers; u-boot-menu writes its boot menu. The board's U-Boot firmware itself stays as it is."
    packages: [ u-boot-menu ]
    architectures: [ arm64, armhf, riscv64 ]
