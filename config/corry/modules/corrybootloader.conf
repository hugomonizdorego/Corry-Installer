# SPDX-License-Identifier: GPL-3.0-or-later
#
# Installs the boot loader chosen on Corry's System page (global storage
# "corrySystem") when it is not GRUB, then removes GRUB from the new system.
# If anything fails, GRUB is installed by the bootloader module as usual.
---
# Used to decide whether the packages can be downloaded.
checkUrl: http://deb.debian.org/debian/
# Boot menu timeout in seconds for systemd-boot, rEFInd and EXTLINUX.
timeout: 5
# Kernel command line parameters, besides root=, resume= and the Btrfs subvolume.
kernelParams: [ quiet ]
# Directory name GRUB uses on the EFI system partition (bootloader.conf efiBootloaderId).
grubEfiDirectory: debian
# GRUB packages purged after the alternative has been installed and checked.
grubPackages:
  - grub-pc
  - grub-pc-bin
  - grub-efi-amd64
  - grub-efi-amd64-bin
  - grub-efi-amd64-signed
  - grub-efi-ia32
  - grub-efi-ia32-bin
  - grub-efi-arm64
  - grub-efi-arm64-bin
  - grub-efi-arm64-signed
  - grub-efi-arm
  - grub-efi-arm-bin
  - grub-efi-riscv64
  - grub-efi-riscv64-bin
  - grub2-common
  - grub-common
  - shim-signed
  - shim-signed-common
  - shim-helpers-amd64-signed
  - shim-helpers-arm64-signed
  - shim-unsigned
