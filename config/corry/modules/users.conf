# SPDX-License-Identifier: CC0-1.0
---
defaultGroups: [ sudo, audio, video, plugdev, netdev, cdrom ]
sudoersGroup: ""
autologinGroup: ""
# The administrator (root) account gets a password too. The users page asks
# whether it is the same as the user's password (checked by default) or a
# different one.
setRootPassword: true
doReusePassword: true
displayAutologin: true
doAutologin: false
# Exactly one non-empty character is accepted. Confirmation must match.
# Do not add libpwquality here: its own lower bounds can reject short passwords.
passwordRequirements:
  minLength: 1
  maxLength: -1
allowWeakPasswords: false
allowWeakPasswordsDefault: false
user:
  shell: /bin/bash
