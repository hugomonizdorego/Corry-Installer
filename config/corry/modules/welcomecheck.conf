# SPDX-License-Identifier: CC0-1.0
# Corry system-check page. Internet is checked and recommended, never required:
# without it, Corry installs everything from the installation media.
---
corryPage: check
showSupportUrl: false
showKnownIssuesUrl: false
showReleaseNotesUrl: false
showDonateUrl: false
requirements:
  requiredStorage: 20
  requiredRam: 1
  internetCheckUrl: http://deb.debian.org/debian/
  check: [ storage, ram, power, internet, root, screen ]
  required: [ storage, ram, root ]
geoip:
  style: none
  url: ""
  selector: ""
