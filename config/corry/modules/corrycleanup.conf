# SPDX-License-Identifier: CC0-1.0
# Debian live-build default username. Change for your ISO; never removes the new user.
---
liveUser: user
# Extra live-only files or directories to delete from the target, relative to
# its root. Corry's own files, launchers and packages are always removed.
removeFiles: []
# Extra live-only packages to purge from the target (dpkg --purge, no autoremove).
purgePackages: []
