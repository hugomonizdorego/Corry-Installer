# Corry greeting page: welcome text, language and the product video.
# The system check runs on the next page (welcomecheck.conf).
---
corryPage: greeting
showSupportUrl: true
showKnownIssuesUrl: true
showReleaseNotesUrl: false
showDonateUrl: false
requirements:
  requiredStorage: 20
  requiredRam: 1
  internetCheckUrl: http://deb.debian.org/debian/
  check: []
  required: []
geoip:
  style: none
  url: ""
  selector: ""
