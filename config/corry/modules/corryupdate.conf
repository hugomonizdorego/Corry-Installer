# SPDX-License-Identifier: CC0-1.0
# Package repair and updates. Without internet only local repairs are made;
# the installation never fails because of this step.
---
# Use the network when it is reachable at install time.
useNetwork: true
# Reachability check; any HTTP(S) URL of the distribution's mirror works.
checkUrl: http://deb.debian.org/debian/
# safe: apt-get upgrade --with-new-pkgs (never removes packages; recommended,
#       especially on Debian testing). full: apt-get full-upgrade. none: no updates.
upgrade: safe
