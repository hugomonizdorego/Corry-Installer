---
efi:
  mountPoint: /boot/efi
  # Corry recommends 300 MiB; the size stays editable in manual partitioning.
  recommendedSize: 300MiB
  minimumSize: 100MiB
  label: EFI
userSwapChoices: [ small, none, suspend ]
initialSwapChoice: small
initialPartitioningChoice: none
allowManualPartitioning: true
defaultFileSystemType: btrfs
availableFileSystemTypes: [ btrfs, ext4, xfs ]
alwaysShowPartitionLabels: true
drawNestedPartitions: true
# Do not advertise full-disk encryption until the target initramfs/GRUB
# integration is tested. Manual encryption remains an advanced feature.
enableLuksAutomatedPartitioning: false
lvm:
  enable: true
directoryFilesystemRestrictions:
  # LVM physical volumes and LUKS containers (manual partitioning), and existing
  # Windows data partitions (NTFS, exFAT) that are kept or mounted as data.
  - directory: any
    allowedFilesystemTypes: [ btrfs, ext4, xfs, ext2, ext3, jfs, reiser, fat32, linuxswap, unformatted,
                              lvm2 pv, luks, luks2, ntfs, exfat ]
  - directory: /
    allowedFilesystemTypes: [ btrfs, ext4, xfs, ext2, ext3, jfs, reiser ]
  # Home folders need Linux permissions.
  - directory: /home
    allowedFilesystemTypes: [ btrfs, ext4, xfs, ext2, ext3, jfs, reiser ]
  - directory: efi
    allowedFilesystemTypes: [ fat32 ]
    onlyWhenMountpoint: true
essentialMounts: [ "live-*", control, ventoy ]
