# SPDX-License-Identifier: CC0-1.0
# Edit teks dan nama file di sini. Semua path relatif terhadap folder ini.
product:
  name: Edukasaun OS
  logo: images/logo.svg
  url: https://github.com/hugomonizdorego/Corry-Installer
  supportUrl: https://github.com/hugomonizdorego/Corry-Installer/issues
palette:
  accent: '#276b49'
  hover: '#1d563a'
  tint: '#eaf4ec'
  soft: '#adceb8'
welcome:
  title: Mulai perjalanan baru Anda.
  description: Pasang {product} dengan panduan yang jelas, satu langkah setiap saat.
  image: images/welcome.svg
  video: video/welcome.webm
  videoAutoplay: false
  videoMuted: true
installation:
  eyebrow: MENYIAPKAN SISTEM ANDA
  music: music/installation.ogg
  musicEnabled: true
  musicVolume: 20
  slideInterval: 9000
  slides:
  - image: images/welcome.svg
    title: Selamat datang di Edukasaun OS
    description: Ruang baru untuk belajar dan berkarya.
  - image: images/work.svg
    title: Belajar. Buat. Bagikan.
    description: Aplikasi pilihan Anda sedang disiapkan.
  - image: images/control.svg
    title: Siap untuk langkah berikutnya
    description: Simpan komputer tetap terhubung ke sumber listrik.
finish:
  title: Instalasi selesai.
  description: '{product} siap digunakan. Pilih untuk memulai ulang atau tetap mencoba
    sesi live.'
  continueLive: Tetap mencoba sesi live
  restart: Mulai ulang ke sistem terpasang setelah menekan Selesai
