# SPDX-License-Identifier: GPL-3.0-or-later
#
# Installs the init system chosen on Corry's System page (global storage
# "corrySystem"). Nothing happens for the default, systemd.
---
# Used to decide whether the packages can be downloaded.
checkUrl: http://deb.debian.org/debian/
# apt's simulation of the switch may remove systemd's own packages (systemd,
# systemd-*, libsystemd*, libpam-systemd, libnss-systemd) and the ones listed
# here, nothing else. Anything else listed as removed, for example gdm3 or
# gnome-shell, keeps systemd and prints a warning instead.
allowedRemovals:
  - dbus-user-session
  - sysv-rc
  - libpam-elogind-compat
# Asked to be removed together with the new packages (apt-get install pkg-):
# apt does not drop manually installed packages on its own, and the live image
# marks every package as manually installed. Only installed ones are named.
remove:
  - systemd-sysv
  - libpam-systemd
  - systemd
  - libnss-systemd
# Packages that only work with systemd as PID 1. When one of them is in the
# image, the switch is refused and systemd stays (the System page already
# hides the alternatives in that case).
needsSystemd:
  - gdm3
  - gnome-shell
  - gnome-session
# After the switch, purge these systemd packages when apt can do so without
# removing anything else. Otherwise they stay installed but inactive.
purge:
  - systemd-sysv
  - libpam-systemd
  - systemd
  - libnss-systemd
  - systemd-timesyncd
  - systemd-resolved
