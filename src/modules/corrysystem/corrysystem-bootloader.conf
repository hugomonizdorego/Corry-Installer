# SPDX-License-Identifier: GPL-3.0-or-later
#
# Corry "Boot loader" page (module corrysystem, instance "bootloader"). GRUB is
# the default: it is installed by the bootloader module and works offline. An
# alternative needs internet; corrybootloader installs it, checks it, and only
# then removes GRUB. Should anything fail, GRUB is installed instead.
#
# Keys per option:
#   id, name, description, packages, default, availableOn: as for the init page
#   firmware      [bios], [efi] or both
#   filesystems   filesystems the loader can read /boot from (empty: all)
#   secureBoot    true if the loader is signed for UEFI Secure Boot and tested with it
#   needsSystemd  the loader's Debian package needs the systemd init
#
# Not offered: U-Boot (Corry's packages are amd64 only; U-Boot is for ARM
# boards) and rEFInd on Debian testing (not in the testing archive).
---
section: bootloader
base: ""
bootloader:
  - id: grub
    name: GRUB 2
    description: "Debian's standard for BIOS and UEFI (grub-pc / grub-efi). Finds other operating systems for dual boot and works with Secure Boot."
    default: true
    firmware: [ bios, efi ]
    secureBoot: true
  - id: systemd-boot
    name: systemd-boot
    description: "Fast, minimal text menu for UEFI. Kernels are copied to the EFI partition and kept up to date by kernel-install. Needs the systemd init."
    packages: [ systemd-boot ]
    firmware: [ efi ]
    needsSystemd: true
    availableOn: [ stable, testing ]
  - id: refind
    name: rEFInd
    description: "Graphical boot menu with icons; finds every operating system on the computer by itself. UEFI only; needs an ext4 or Btrfs /boot."
    packages: [ refind ]
    firmware: [ efi ]
    filesystems: [ ext2, ext3, ext4, btrfs ]
    availableOn: [ stable ]
  - id: extlinux
    name: Syslinux / EXTLINUX
    description: "Very small loader for older BIOS computers. Needs an ext4 or XFS /boot (it cannot read compressed Btrfs)."
    packages: [ extlinux, syslinux-common ]
    firmware: [ bios ]
    filesystems: [ ext2, ext3, ext4, xfs ]
    availableOn: [ stable, testing ]
