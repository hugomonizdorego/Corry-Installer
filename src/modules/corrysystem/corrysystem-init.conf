# SPDX-License-Identifier: GPL-3.0-or-later
#
# Corry "Init system" page (module corrysystem, instance "init"). The option
# marked default is what the live image already has: it works offline and is
# removed cleanly when an alternative is installed. Every alternative needs
# internet: its packages are downloaded from the distribution's repositories
# during installation.
#
# Keys per option:
#   id            short name used in global storage ("corrySystem")
#   name          shown on the page
#   description   one or two sentences, shown on the page
#   packages      Debian packages installed into the target (empty for the default).
#                 Without systemd there is no user session bus, journal or timers:
#                 the init options add dbus-x11, rsyslog and cron for those.
#   default       true for the one option that is already installed
#   availableOn   Debian bases whose archive has every package: stable, testing.
#                 CI checks this list against the real archives.
---
section: init
# The Debian base of this distribution (stable or testing), written by
# tools/corry-branding.py from distro.yaml. Empty: read /etc/debian_version.
base: ""
init:
  - id: systemd
    name: systemd
    description: "Debian's default since Debian 8. Starts services in parallel and manages the whole system."
    default: true
  - id: sysvinit
    name: SysVinit
    description: "The classic sequential init of Linux, with runlevels and /etc/init.d scripts. Session management comes from elogind; systemd is removed."
    packages: [ sysvinit-core, elogind, libpam-elogind, orphan-sysvinit-scripts, dbus-x11, rsyslog, cron ]
    availableOn: [ stable, testing ]
  - id: openrc
    name: OpenRC
    description: "Dependency-based service manager: more modern than SysVinit, lighter than systemd. Debian runs it on the SysVinit init; systemd is removed."
    packages: [ openrc, sysvinit-core, elogind, libpam-elogind, orphan-sysvinit-scripts, dbus-x11, rsyslog, cron ]
    availableOn: [ stable, testing ]
  - id: runit
    name: runit
    description: "Very small and fast service supervision; a good fit for old hardware. systemd is removed."
    packages: [ runit-init, runit-services, elogind, libpam-elogind, orphan-sysvinit-scripts, dbus-x11, rsyslog, cron ]
    availableOn: [ stable, testing ]
